<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph viewer</title>
<!-- DTUwrite plugin (Insert → Plugins, or a card's ⋯ → Plot), or open it on its own in a browser.
     One self-contained file; KaTeX (the typeset equation) comes from the web, and without it the
     equation is shown in plain text. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onload="window.graphViewer && window.graphViewer.katexReady()"></script>
<style>
:root { --bg: #ffffff; --panel: #f5f6f8; --ink: #1b1b1b; --muted: #5f6672; --line: #d5d9df; --grid: #eaecef; --axis: #59606b;
  --accent: #1f5fd1; --warn: #b86a00; --warnbg: #ffefc2; --field: #ffffff; --err: #c62828; }
body[data-theme=dark] { --bg: #1f2b26; --panel: #253430; --ink: #f2f1e8; --muted: #a8b4ae; --line: #3c4e46; --grid: #2b3a34; --axis: #9fb0a8;
  --accent: #7fb2ff; --warn: #ffcf66; --warnbg: #4d411c; --field: #18221e; --err: #ff8a80; }
/* large, readable type that scales with the size of the pane (a slide, a board pane or a full window) */
html { font-size: clamp(16px, min(2.15vw, 3.7vh), 30px); }
html, body { margin: 0; height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
button, input { font: inherit; color: inherit; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* the equations */
#curves { padding: .3rem .6rem .35rem; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: .15rem; max-height: 38vh; overflow-y: auto; }
.crow { display: flex; align-items: center; gap: .5rem; min-height: 2.3rem; }
.crow.hidden .eq { opacity: .4; }
.dot { width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 0; padding: 0; flex: none; cursor: pointer; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--line); }
.crow.hidden .dot { background: transparent !important; box-shadow: inset 0 0 0 3px currentColor; }
.eq { flex: 1; min-width: 0; font-size: 1.3rem; cursor: text; overflow-x: auto; overflow-y: hidden; white-space: nowrap; padding: .15rem .25rem; border-radius: .3rem; }
.eq:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.eq .katex { font-size: 1.12em; }
.eq.plain { font-family: "Cambria Math", "Times New Roman", serif; }
.eqin { flex: 1; min-width: 0; font: 1rem ui-monospace, Consolas, monospace; padding: .3rem .45rem; border: 2px solid var(--accent); border-radius: .35rem; background: var(--field); outline: none; }
.err, .unote { font-size: .75rem; margin: -.1rem 0 .15rem 1.7rem; }
.err { color: var(--err); }
.unote { color: var(--warn); }
.unote.dim { color: var(--muted); }
.ibtn { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 1rem; padding: .1rem .3rem; border-radius: .3rem; flex: none; }
.ibtn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
.addrow { display: flex; }
.addbtn { border: 1px dashed var(--line); background: none; color: var(--muted); cursor: pointer; border-radius: .35rem; font-size: .8rem; padding: .1rem .6rem; margin-left: 1.65rem; }
.addbtn:hover { color: var(--ink); border-color: var(--muted); }

/* symbols in the equation: amber = still needs a value; underlined = a slider; dotted = a constant */
.gsym { cursor: pointer; border-radius: .18em; transition: background .12s; }
.gsym.unset { background: var(--warnbg); box-shadow: inset 0 -.1em 0 var(--warn); }
.gsym.param { box-shadow: inset 0 -.08em 0 var(--accent); }
.gsym.const { box-shadow: inset 0 -.07em 0 var(--muted); }
.gsym:hover, .gsym.on { background: color-mix(in srgb, var(--accent) 22%, transparent); }

main { display: grid; grid-template-columns: 1fr minmax(11.5rem, 31%); min-height: 0; }
@media (max-aspect-ratio: 1/1) { main { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(8rem, 38%); } #panel { border-left: 0 !important; border-top: 1px solid var(--line); } }

/* the plot */
#plotBox { position: relative; min-width: 0; min-height: 0; }
#plot { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#plot.dragging { cursor: grabbing; }
.end { position: absolute; width: 4.3em; font-size: .8rem; padding: .05rem .2rem; border: 1px solid transparent; border-radius: .3rem; background: transparent; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.end:hover { border-color: var(--line); background: var(--field); }
.end:focus { border-color: var(--accent); background: var(--field); outline: none; }
.end.bad, input.bad { border-color: var(--err) !important; }
#xmin { text-align: left; } #xmax { text-align: right; } #ymin, #ymax { text-align: right; }
#tools { position: absolute; display: flex; flex-direction: column; gap: .2rem; }
#tools button { width: 1.9rem; height: 1.9rem; border-radius: .4rem; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; color: var(--ink); }
#tools button:hover { border-color: var(--muted); }

/* the control panel */
#panel { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: .35rem .65rem .6rem; }
#panel h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: .35rem 0 .2rem; font-weight: 600; }
.hint { font-size: .75rem; color: var(--warn); margin: .2rem 0 .3rem; }
.prow { padding: .25rem 0 .35rem; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.ptop { display: flex; align-items: center; gap: .35rem; }
.pname { font-size: 1.15rem; padding: 0 .15rem; }
.pname .katex { font-size: 1.05em; }
.eqs { color: var(--muted); }
.pval { flex: 1; min-width: 0; width: 3em; font-size: 1rem; font-weight: 600; padding: .05rem .25rem; border: 1px solid var(--line); border-radius: .3rem; background: var(--field); font-variant-numeric: tabular-nums; }
.punit { font-size: .75rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.pval:focus, .pend:focus, #pop input:focus { outline: none; border-color: var(--accent); }
.play { border: 1px solid var(--line); background: var(--field); border-radius: .3rem; cursor: pointer; width: 1.7rem; height: 1.7rem; padding: 0; font-size: .75rem; flex: none; }
.play.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.prange { width: 100%; margin: .3rem 0 0; height: 1.6rem; accent-color: var(--accent); cursor: pointer; }
.pends { display: flex; justify-content: space-between; }
.pend { width: 5.6em; font-size: .7rem; color: var(--muted); padding: 0 .2rem; border: 1px solid transparent; border-radius: .25rem; background: transparent; }
.pend:hover { border-color: var(--line); }
.pend.r { text-align: right; }
.crow2 { display: flex; align-items: center; flex-wrap: wrap; gap: 0 .35rem; padding: .2rem 0; }
.crow2 .note { flex-basis: 100%; font-size: .65rem; color: var(--muted); padding-left: .2rem; }
.empty { color: var(--muted); font-size: .8rem; }

/* the box that asks for a value */
#pop { position: fixed; z-index: 10; background: var(--bg); border: 1px solid var(--line); border-radius: .5rem; box-shadow: 0 .4rem 1.4rem rgba(0,0,0,.22); padding: .45rem .6rem .55rem; font-size: .85rem; max-width: min(25rem, 94vw); }
#pop .ph { display: flex; align-items: center; gap: .4rem; font-size: 1.25rem; flex-wrap: wrap; }
#pop .ph input { width: 6.5em; font-size: 1.1rem; font-weight: 600; padding: .1rem .3rem; border: 2px solid var(--line); border-radius: .35rem; background: var(--field); }
#pop .ph input.u { width: 4.5em; font-size: .95rem; font-weight: 400; }
#pop .pr { margin-top: .35rem; display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; color: var(--muted); }
#pop .pr input { width: 5em; padding: .05rem .25rem; border: 1px solid var(--line); border-radius: .3rem; background: var(--field); }
#pop .chips { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .4rem; }
#pop .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 1rem; padding: .05rem .55rem; cursor: pointer; font-size: .75rem; }
#pop .chip:hover { border-color: var(--accent); }
#pop .act { margin-top: .45rem; display: flex; gap: .4rem; flex-wrap: wrap; }
#pop .act button { border: 1px solid var(--line); background: var(--panel); border-radius: .35rem; padding: .1rem .5rem; cursor: pointer; font-size: .8rem; }
#pop .note { color: var(--muted); font-size: .75rem; margin-top: .25rem; }
#pop .uerr { color: var(--err); font-size: .75rem; margin-top: .2rem; }
#pal { position: fixed; z-index: 11; background: var(--bg); border: 1px solid var(--line); border-radius: .5rem; box-shadow: 0 .4rem 1.4rem rgba(0,0,0,.22); padding: .4rem; display: grid; grid-template-columns: repeat(4, 1.6rem); gap: .3rem; }
#pal button { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 0; cursor: pointer; }
#pal button.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
#pal .hide { grid-column: 1 / -1; width: auto; height: auto; border-radius: .35rem; border: 1px solid var(--line); background: var(--panel); font-size: .75rem; padding: .15rem; color: var(--ink); }
</style>
</head>
<body>
<div id="app">
  <header id="curves"></header>
  <main>
    <section id="plotBox">
      <canvas id="plot"></canvas>
      <input class="end" id="ymax" title="Top of the vertical axis">
      <input class="end" id="ymin" title="Bottom of the vertical axis">
      <input class="end" id="xmin" title="Left end of the horizontal axis">
      <input class="end" id="xmax" title="Right end of the horizontal axis">
      <div id="tools">
        <button data-t="in" title="Zoom in">＋</button>
        <button data-t="out" title="Zoom out">−</button>
        <button data-t="fit" title="Fit the vertical axis to the curves (or double-click the graph)">⤢</button>
        <button data-t="home" title="Back to the start view">⌂</button>
        <button data-t="theme" title="Light / dark (like the white and the black board)">◐</button>
      </div>
    </section>
    <aside id="panel"></aside>
  </main>
</div>
<div id="pop" hidden></div>
<div id="pal" hidden></div>
<script>
'use strict';
// ============================================================================ start configuration
// Edit this block to make a ready-made copy (e.g. one per slide). Equations may be typed as plain text
// ("y = A sin(k x) + b") or LaTeX ("y = \\frac{A}{1 + (x/x_0)^2}"), also implicit ("x^2 + y^2 = r^2").
// Values given here count as defined; unit: e.g. 'nm', 'J s', 'm/s^2' ('1' = no unit).
// Opened on its own, the address can also set it: graph-viewer.html#eq=y%3Dx%5E2&x=-5,5&y=0,25&theme=dark
const START = {
  curves: ['y = A \\sin(k x + \\varphi)'],
  values: { A: { v: 1, min: 0, max: 2 }, k: { v: 1, min: 0, max: 4 }, 'φ': { v: 0, min: -3.14, max: 3.14 } },
  x: [-10, 10],
  y: [-2.5, 2.5],
  theme: 'light',
};

// the pen colours of DTUwrite (white board / black board), in the order new curves take them
const PALETTE = {
  light: { blue: '#1f5fd1', red: '#c62828', green: '#2e7d32', orange: '#e65100', purple: '#6a1b9a', teal: '#00838f', yellow: '#f9a825', auto: '#1b1b1b' },
  dark: { blue: '#7fb2ff', red: '#ff8a80', green: '#9ae6a0', orange: '#ffb74d', purple: '#ce93d8', teal: '#80deea', yellow: '#fff176', auto: '#f2f1e8' },
};
const COLOR_ORDER = ['blue', 'red', 'green', 'orange', 'purple', 'teal', 'yellow', 'auto'];
const COLOR_NAME = { blue: 'Blue', red: 'Red', green: 'Green', orange: 'Orange', purple: 'Purple', teal: 'Teal', yellow: 'Yellow', auto: 'Ink' };

// constants offered when a symbol has one of these names (never filled in by themselves, except Euler's e)
const KNOWN = [
  { n: 'e', v: Math.E, unit: '1', label: "Euler's number" },
  { n: 'e', v: 1.602176634e-19, unit: 'C', label: 'elementary charge' },
  { n: 'h', v: 6.62607015e-34, unit: 'J s', label: 'Planck constant' },
  { n: 'ħ', v: 1.054571817e-34, unit: 'J s', label: 'reduced Planck constant' },
  { n: 'c', v: 299792458, unit: 'm/s', label: 'speed of light' },
  { n: 'k_B', v: 1.380649e-23, unit: 'J/K', label: 'Boltzmann constant' },
  { n: 'k_e', v: 8.9875517923e9, unit: 'N m^2/C^2', label: 'Coulomb constant' },
  { n: 'm_e', v: 9.1093837015e-31, unit: 'kg', label: 'electron mass' },
  { n: 'm_p', v: 1.67262192e-27, unit: 'kg', label: 'proton mass' },
  { n: 'ε_0', v: 8.8541878128e-12, unit: 'F/m', label: 'vacuum permittivity' },
  { n: 'μ_0', v: 1.25663706212e-6, unit: 'N/A^2', label: 'vacuum permeability' },
  { n: 'μ_B', v: 9.2740100783e-24, unit: 'J/T', label: 'Bohr magneton' },
  { n: 'a_0', v: 5.29177210903e-11, unit: 'm', label: 'Bohr radius' },
  { n: 'g', v: 9.81, unit: 'm/s^2', label: 'gravity at the surface' },
  { n: 'G', v: 6.6743e-11, unit: 'N m^2/kg^2', label: 'gravitational constant' },
  { n: 'N_A', v: 6.02214076e23, unit: '1/mol', label: 'Avogadro constant' },
  { n: 'R', v: 8.314462618, unit: 'J/(mol K)', label: 'gas constant' },
  { n: 'σ', v: 5.670374419e-8, unit: 'W/(m^2 K^4)', label: 'Stefan–Boltzmann constant' },
  { n: 'Φ_0', v: 2.067833848e-15, unit: 'Wb', label: 'flux quantum h/2e' },
];

// ============================================================================ reading an equation
const GREEK = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', varepsilon: 'ε', zeta: 'ζ', eta: 'η', theta: 'θ', vartheta: 'ϑ',
  iota: 'ι', kappa: 'κ', lambda: 'λ', mu: 'μ', nu: 'ν', xi: 'ξ', rho: 'ρ', varrho: 'ϱ', sigma: 'σ', tau: 'τ', upsilon: 'υ', phi: 'φ', varphi: 'φ',
  chi: 'χ', psi: 'ψ', omega: 'ω', Gamma: 'Γ', Delta: 'Δ', Theta: 'Θ', Lambda: 'Λ', Xi: 'Ξ', Pi: 'Π', Sigma: 'Σ', Phi: 'Φ', Psi: 'Ψ', Omega: 'Ω' };
const TEX_OF = { ħ: '\\hbar', ℓ: '\\ell', φ: '\\varphi', ε: '\\varepsilon' };
for (const [w, u] of Object.entries(GREEK)) if (!TEX_OF[u]) TEX_OF[u] = '\\' + w;

function erf(x) { // Abramowitz & Stegun 7.1.26
  const s = Math.sign(x), a = Math.abs(x), t = 1 / (1 + 0.3275911 * a);
  return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a));
}
function gamma(x) { // Lanczos
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61503916999185, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  x -= 1; let a = c[0]; const t = x + g + 0.5;
  for (let i = 1; i < 9; i++) a += c[i] / (x + i);
  return Math.sqrt(2 * Math.PI) * Math.pow(t, x + 0.5) * Math.exp(-t) * a;
}
const FN = {
  sin: Math.sin, cos: Math.cos, tan: Math.tan, cot: x => 1 / Math.tan(x), sec: x => 1 / Math.cos(x), csc: x => 1 / Math.sin(x),
  arcsin: Math.asin, arccos: Math.acos, arctan: Math.atan, asin: Math.asin, acos: Math.acos, atan: Math.atan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh, coth: x => 1 / Math.tanh(x), arsinh: Math.asinh, arcosh: Math.acosh, artanh: Math.atanh,
  asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
  exp: Math.exp, ln: Math.log, log: Math.log10, lg: Math.log10, sqrt: Math.sqrt, abs: Math.abs, sgn: Math.sign, sign: Math.sign,
  floor: Math.floor, ceil: Math.ceil, round: Math.round, erf, sinc: x => (x === 0 ? 1 : Math.sin(x) / x),
};
const INVERSE = { sin: 'arcsin', cos: 'arccos', tan: 'arctan', sinh: 'arsinh', cosh: 'arcosh', tanh: 'artanh' };
// letter runs are read as these words where they occur, otherwise one letter = one symbol ("kx" = k·x)
const WORDS = [...Object.keys(FN), ...Object.keys(GREEK), 'pi', 'hbar', 'ell', 'infty'].sort((a, b) => b.length - a.length);

function tokenize(src) {
  const latex = /[\\{}]/.test(src);
  const s = String(src)
    .replace(/\$/g, '')
    .replace(/[−–]/g, '-').replace(/[·⋅×∙]/g, '*').replace(/÷/g, '/')
    .replace(/²/g, '^2').replace(/³/g, '^3')
    .replace(/√/g, '\\sqrt ').replace(/π/g, '\\pi ').replace(/∞/g, '\\infty ').replace(/ϕ/g, 'φ').replace(/ϵ/g, 'ε')
    .replace(/\\(left|right)\./g, '')
    .replace(/\\(left|right|bigl|bigr|Bigl|Bigr|biggl|biggr|bigg|Bigg|big|Big|displaystyle|textstyle)(?![a-zA-Z])/g, '')
    .replace(/\\(lvert|rvert|vert|mid)(?![a-zA-Z])/g, '|')
    .replace(/\\(cdot|times|ast)(?![a-zA-Z])/g, '*').replace(/\\div(?![a-zA-Z])/g, '/')
    .replace(/\\(quad|qquad)(?![a-zA-Z])/g, ' ').replace(/\\[,;:! ]|~/g, ' ')
    .replace(/\\\{/g, '(').replace(/\\\}/g, ')');
  const toks = [];
  let i = 0;
  const add = (w, pos, end) => { // one word or letter
    if (FN[w]) toks.push({ t: 'fn', v: w, raw: w, pos, end });
    else if (w === 'pi') toks.push({ t: 'pi', raw: 'π', pos, end });
    else if (w === 'infty') toks.push({ t: 'num', v: Infinity, raw: '∞', pos, end });
    else toks.push({ t: 'id', v: GREEK[w] || { hbar: 'ħ', ell: 'ℓ' }[w] || w, raw: w, pos, end });
  };
  const group = () => { // the {…} after \text and friends, as plain text
    while (s[i] === ' ') i++;
    if (s[i] !== '{') return s[i++] || '';
    let d = 0, j = i;
    for (; j < s.length; j++) { if (s[j] === '{') d++; else if (s[j] === '}' && --d === 0) break; }
    const g = s.slice(i + 1, j); i = j + 1; return g;
  };
  while (i < s.length) {
    const c = s[i], rest = s.slice(i);
    if (/\s/.test(c)) { i++; continue; }
    let m;
    if ((m = /^(\d+(?:[.,]\d+)?|\.\d+)(?:[eE][+-]?\d+)?/.exec(rest))) {
      toks.push({ t: 'num', v: parseFloat(m[0].replace(',', '.')), raw: m[0], pos: i, end: i + m[0].length }); i += m[0].length; continue;
    }
    if (c === '\\') {
      m = /^\\([a-zA-Z]+)/.exec(rest);
      if (!m) { i++; continue; }
      const at = i; i += m[0].length; const w = m[1];
      if (/^[dtc]?frac$/.test(w)) toks.push({ t: 'frac', raw: '\\frac', pos: at, end: i });
      else if (w === 'sqrt') toks.push({ t: 'sqrt', raw: '\\sqrt', pos: at, end: i });
      else if (/^(text|textrm|textit|mathrm|mathit|mathbf|mathsf|operatorname|rm|it)$/.test(w)) {
        const g = group().replace(/\\([a-zA-Z]+)/g, (q, x) => GREEK[x] || x).replace(/[\s{}\\]/g, '');
        if (g) toks.push(FN[g] ? { t: 'fn', v: g, raw: g, pos: at, end: i } : { t: 'id', v: g, raw: g, pos: at, end: i });
      } else add(w, at, i);
      continue;
    }
    if ((m = /^[A-Za-z\u0370-\u03ffħℓ]+/.exec(rest))) {
      const w = m[0];
      for (let k = 0; k < w.length;) {
        const piece = WORDS.find(x => w.startsWith(x, k)) || w[k];
        add(piece, i + k, i + k + piece.length); k += piece.length;
      }
      i += w.length; continue;
    }
    if ('+-*/^()[]{}|=,!\'_'.includes(c)) { toks.push({ t: c, raw: c, pos: i, end: i + 1 }); i++; continue; }
    throw new Error(`"${c}" is not understood`);
  }
  // subscripts: k_F, v_{max}, x_0, \log_{10}; plain "x0" is x_0 too
  const nameOf = t => (t.t === 'id' ? t.v : t.raw);
  for (let k = 0; k < toks.length; k++) {
    const a = toks[k], b = toks[k + 1];
    if (!b) break;
    if (b.t === '_' && (a.t === 'id' || a.t === 'fn')) {
      let sub = '', cut = 1;
      if (toks[k + 2] && toks[k + 2].t === '{') {
        let d = 0, j = k + 2;
        for (; j < toks.length; j++) { if (toks[j].t === '{') d++; else if (toks[j].t === '}' && --d === 0) break; }
        sub = toks.slice(k + 3, j).map(nameOf).join(''); cut = j - k;
      } else {
        let j = k + 2;
        while (toks[j] && ['id', 'num', 'pi'].includes(toks[j].t) && (j === k + 2 || (!latex && toks[j].pos === toks[j - 1].end))) j++;
        if (latex && j > k + 3) j = k + 3;
        sub = toks.slice(k + 2, j).map(nameOf).join(''); cut = j - k - 1;

  el.addEventListener('change', () => { try { setView(k, valueOf(el.value)); } catch { el.classList.add('bad'); } });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); if (e.key === 'Escape') { el.value = fmtIn(state.view[k]); el.blur(); } });
  el.addEventListener('focus', () => el.select());
}

// y-range that shows the curves over the present x-range (ignoring spikes near asymptotes)
function sampleYs(curves) {
  const E = envs(), va = vAxis(), ys = [];
  const { x0, x1 } = state.view;
  for (const c of curves) {
    if (!c.fn || c.hidden || c.parsed.kind !== 'explicit') continue;
    const yAt = curveFn(c, E, va);
    for (let k = 0; k <= 400; k++) { const y = yAt(x0 + (x1 - x0) * k / 400); if (isFinite(y)) ys.push(y); }
  }
  return ys.sort((a, b) => a - b);
}
function fitY() {
  const ys = sampleYs(state.curves);
  if (!ys.length) {
    // implicit curves only: same scale on both axes around the middle
    if (hasImplicit()) { const { x0, x1, y0, y1 } = state.view, { pw, ph } = geom, cy = (y0 + y1) / 2, h = (x1 - x0) * ph / pw; state.view = { ...state.view, y0: cy - h / 2, y1: cy + h / 2 }; draw(); }
    return;
  }
  let lo = ys[Math.floor(ys.length * 0.02)], hi = ys[Math.ceil(ys.length * 0.98) - 1];
  if (hi - lo < 1e-12 * Math.max(1, Math.abs(hi))) { const d = Math.abs(hi) * 0.5 || 1; lo -= d; hi += d; }
  const pad = (hi - lo) * 0.1;
  state.view = { ...state.view, y0: lo - pad, y1: hi + pad };
  draw();
}
// after a new equation: refit only when the new curve is hardly visible
function fitIfLost(c) {
  if (c.parsed && c.parsed.kind === 'implicit') return;
  const ys = sampleYs([c]);
  const { y0, y1 } = state.view;
  const inside = ys.filter(y => y >= y0 && y <= y1).length;
  if (!ys.length || inside < 0.15 * ys.length) fitY();
}
function zoomAt(px, py, fx, fy) {
  const v = state.view, { L, T, pw, ph } = geom;
  const xv = v.x0 + (px - L) / pw * (v.x1 - v.x0), yv = v.y1 - (py - T) / ph * (v.y1 - v.y0);
  state.view = { x0: xv - (xv - v.x0) * fx, x1: xv + (v.x1 - xv) * fx, y0: yv - (yv - v.y0) * fy, y1: yv + (v.y1 - yv) * fy };
  draw();
}
toolsEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const { L, T, pw, ph } = geom;
  if (b.dataset.t === 'in') zoomAt(L + pw / 2, T + ph / 2, 0.7, 0.7);
  if (b.dataset.t === 'out') zoomAt(L + pw / 2, T + ph / 2, 1 / 0.7, 1 / 0.7);
  if (b.dataset.t === 'fit') fitY();
  if (b.dataset.t === 'home') { state.view = { x0: START.x[0], x1: START.x[1], y0: START.y[0], y1: START.y[1] }; draw(); }
  if (b.dataset.t === 'theme') { state.themeChosen = true; setTheme(state.theme === 'dark' ? 'light' : 'dark'); }
});
function setTheme(t) { state.theme = t === 'dark' ? 'dark' : 'light'; document.body.dataset.theme = state.theme; renderCurves(); draw(); }

// pan with one finger, pen or mouse; pinch with two; the wheel zooms (Shift: only across, Alt: only up/down)
const pts = new Map();
let drag = null;
const local = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const baseline = () => { drag = { view: { ...state.view }, pts: new Map([...pts].map(([k, v]) => [k, { ...v }])) }; };
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, local(e)); baseline();
  state.hover = null; cv.classList.add('dragging'); closePop();
});
cv.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) {
    if (e.pointerType === 'touch') return;
    const q = local(e), { L, T, pw, ph } = geom;
    state.hover = q.x >= L && q.x <= L + pw && q.y >= T && q.y <= T + ph ? state.view.x0 + (q.x - L) / pw * (state.view.x1 - state.view.x0) : null;
    draw(); return;
  }
  pts.set(e.pointerId, local(e));
  const v = drag.view, { L, T, pw, ph } = geom, ids = [...pts.keys()];
  if (ids.length === 1) {
    const a = drag.pts.get(ids[0]), b = pts.get(ids[0]);
    if (!a) return;
    const dx = (b.x - a.x) / pw * (v.x1 - v.x0), dy = (b.y - a.y) / ph * (v.y1 - v.y0);
    state.view = { x0: v.x0 - dx, x1: v.x1 - dx, y0: v.y0 + dy, y1: v.y1 + dy };
  } else {
    const [i, j] = ids, a0 = drag.pts.get(i), a1 = drag.pts.get(j), b0 = pts.get(i), b1 = pts.get(j);
    if (!a0 || !a1) return;
    const s = Math.hypot(a1.x - a0.x, a1.y - a0.y) / Math.max(1, Math.hypot(b1.x - b0.x, b1.y - b0.y));
    const ca = { x: (a0.x + a1.x) / 2, y: (a0.y + a1.y) / 2 }, cb = { x: (b0.x + b1.x) / 2, y: (b0.y + b1.y) / 2 };
    const xv = v.x0 + (ca.x - L) / pw * (v.x1 - v.x0), yv = v.y1 - (ca.y - T) / ph * (v.y1 - v.y0);
    const w = (v.x1 - v.x0) * s, h = (v.y1 - v.y0) * s;
    const nx0 = xv - (cb.x - L) / pw * w, ny1 = yv + (cb.y - T) / ph * h;
    state.view = { x0: nx0, x1: nx0 + w, y0: ny1 - h, y1: ny1 };
  }
  draw();
});
const lift = e => { if (!pts.delete(e.pointerId)) return; baseline(); if (!pts.size) cv.classList.remove('dragging'); };
cv.addEventListener('pointerup', lift);
cv.addEventListener('pointercancel', lift);
cv.addEventListener('pointerleave', () => { if (!pts.size && state.hover != null) { state.hover = null; draw(); } });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), q = local(e);
  zoomAt(q.x, q.y, e.altKey ? 1 : f, e.shiftKey ? 1 : f);
}, { passive: false });
cv.addEventListener('dblclick', fitY);

// ============================================================================ saved with the board page
// In DTUwrite the board keeps this graph's state with the page (and sends it to students): the plugin
// says it is ready, gets back what was saved (or nothing), and from then on reports its changes.
const inFrame = window.parent !== window;
let hostAnswered = false, lastSaved = '', saveTimer = 0;
function snapshot() {
  const keep = new Set([...usedNames(), axisVar(), ...(hasImplicit() ? [yVarOf()] : [])]);
  const params = {};
  for (const [n, P] of state.params) if (keep.has(n)) params[n] = { v: P.v, min: P.min, max: P.max, set: P.set, slider: P.slider, note: P.note || undefined, unit: P.unit || undefined };
  return {
    v: 1, curves: state.curves.filter(c => c.src).map(c => ({ src: c.src, color: c.color, hidden: c.hidden || undefined })),
    params, xVar: state.xVar || undefined, yVar: state.yVar || undefined, yUnit: state.yUnit || undefined,
    view: state.view, theme: state.themeChosen ? state.theme : undefined,
  };
}
function saveLater() {
  if (!inFrame || !hostAnswered) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const s = JSON.stringify(snapshot());
    if (s === lastSaved) return;
    lastSaved = s;
    window.parent.postMessage({ type: 'dtuwrite-plugin-state', plugin: 'graph-viewer', state: JSON.parse(s) }, '*');
  }, 600);
}
function restore(st) {
  if (!st || typeof st !== 'object') return;
  state.playing.clear();
  if (st.params && typeof st.params === 'object') {
    for (const [n, p] of Object.entries(st.params)) {
      if (!p || !isFinite(+p.v)) continue;
      state.params.set(n, { v: +p.v, min: isFinite(+p.min) ? +p.min : -2, max: isFinite(+p.max) ? +p.max : 2, set: !!p.set, slider: p.slider !== false, note: p.note || '', unit: p.unit || '' });
    }
  }
  if (Array.isArray(st.curves)) {
    state.curves = [];
    for (const c of st.curves) {
      const src = typeof c === 'string' ? c : c && c.src;
      if (typeof src !== 'string') continue;
      for (const line of curvesFromLatex(src)) {
        const cv2 = addCurve(line, { quiet: true });
        if (c.color && PALETTE.light[c.color]) cv2.color = c.color;
        cv2.hidden = !!c.hidden;
      }
    }
  }
  if (typeof st.xVar === 'string') state.xVar = st.xVar;
  if (typeof st.yVar === 'string') state.yVar = st.yVar;
  if (typeof st.yUnit === 'string') state.yUnit = st.yUnit;
  const v = st.view;
  const okView = v && [v.x0, v.x1, v.y0, v.y1].every(q => isFinite(+q)) && +v.x1 > +v.x0 && +v.y1 > +v.y0;
  if (okView) state.view = { x0: +v.x0, x1: +v.x1, y0: +v.y0, y1: +v.y1 };
  if (st.theme === 'dark' || st.theme === 'light') { state.themeChosen = true; state.theme = st.theme; document.body.dataset.theme = st.theme; }
  renderAll();
  if (!okView) { if (state.curves.some(c => c.fn && c.parsed.kind === 'explicit')) fitY(); else if (hasImplicit()) fitY(); }
}

// ============================================================================ start
function renderAll() { analyse(); renderCurves(); renderPanel(); draw(); }
function readHash() {
  if (!/^#./.test(location.hash)) return;
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.getAll('eq').length) START.curves = q.getAll('eq');
  const pair = k => { const v = (q.get(k) || '').split(',').map(Number); return v.length === 2 && v.every(isFinite) && v[1] > v[0] ? v : null; };
  START.x = pair('x') || START.x; START.y = pair('y') || START.y;
  if (q.get('theme')) START.theme = q.get('theme');
  state.theme = START.theme === 'dark' ? 'dark' : 'light';
  state.view = { x0: START.x[0], x1: START.x[1], y0: START.y[0], y1: START.y[1] };
}
try { readHash(); } catch { /* a sandboxed frame has no address */ }
document.body.dataset.theme = state.theme;
for (const s of START.curves) addCurve(s, { quiet: true });
new ResizeObserver(() => draw()).observe(box);
// messages from DTUwrite (or another page that embeds this):
//   { type: 'dtuwrite-plot', latex: 'y = …' }            one more curve (one per line of the LaTeX)
//   { type: 'dtuwrite-theme', theme: 'dark' | 'light' }   the board colour (unless ◐ was pressed)
//   { type: 'dtuwrite-plugin-restore', state }            the saved state (or null) after 'ready'
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'dtuwrite-plot' && typeof d.latex === 'string') {
    let last = null;
    for (const line of curvesFromLatex(d.latex)) last = addCurve(line, { quiet: true });
    renderAll();
    if (last && last.fn) fitIfLost(last);
  }
  if (d.type === 'dtuwrite-theme' && !state.themeChosen) setTheme(d.theme);
  if (d.type === 'dtuwrite-plugin-restore') { if (d.state) restore(d.state); hostAnswered = true; lastSaved = JSON.stringify(snapshot()); saveLater(); }
});
window.graphViewer = { state, parseEquation, parseUnit, tokenize, valueOf, addCurve, setSource, renderAll, fitY, setTheme, snapshot, restore, vAxis, katexReady: renderAll };
renderAll();
if (inFrame) window.parent.postMessage({ type: 'dtuwrite-plugin-ready', plugin: 'graph-viewer' }, '*');
</script>
</body>
</html>
