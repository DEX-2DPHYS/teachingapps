<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ink2latex lecture</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5fd1'/%3E%3Cpath d='M7 23 Q12 6 16 16 T25 9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="viewer.css?v=2026-10-01.1148">
</head>
<body>

<!-- join screen -->
<section id="join" hidden>
  <div class="join-card">
    <h1>Follow a lecture</h1>
    <p class="dim">Type the code shown on the board.</p>
    <form id="joinForm">
      <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123">
      <button type="submit">Join</button>
    </form>
    <p id="joinMsg" class="msg"></p>
    <p class="ver">version <span class="ver-stamp">2026-10-01.1148</span></p>
  </div>
</section>

<!-- lecture -->
<section id="lecture" hidden>
  <header id="bar">
    <div class="title"><span id="liveDot" title="connection"></span><strong id="lecTitle"></strong> <span id="lecCourse" class="dim"></span></div>
    <div class="nav">
      <button id="prev" title="Previous page">◀</button>
      <span id="pageNo">–</span>
      <button id="next" title="Next page">▶</button>
      <label class="check" title="Show the page the lecturer is on"><input type="checkbox" id="follow" checked> Follow</label>
    </div>
    <div class="notes-tools">
      <button id="noteMode" title="Write your own notes on the page. Only you can see them.">✎<span class="lbl"> My notes</span></button>
      <button id="textMode" title="Type on the page: click where the text should go. Only you can see it.">T<span class="lbl"> Text</span></button>
      <button id="noteErase" class="keep-room" title="Erase your notes (drag over them)" hidden>⌫</button>
      <button id="noteUndo" class="keep-room" title="Undo your last note stroke" hidden>↶</button>
      <span id="noteState" class="dim small"></span>
    </div>
    <div id="viewWrap">
      <button id="viewBtn" title="What to show">View ▾</button>
      <div id="viewMenu" hidden>
        <label><input type="radio" name="view" value="ink"> Ink</label>
        <label><input type="radio" name="view" value="both"> Ink + typeset</label>
        <label><input type="radio" name="view" value="typeset"> Typeset</label>
        <label><input type="radio" name="view" value="doc"> Document</label>
        <hr>
        <label title="Your private notes on the page (ink and text)"><input type="checkbox" id="showNotes" checked> My notes</label>
        <label title="Your questions to the lecturer, where you placed them"><input type="checkbox" id="showQuestions" checked> Comments &amp; questions</label>
        <div class="ver">version <span class="ver-stamp">2026-10-01.1148</span></div>
      </div>
    </div>
    <button id="sideBtn" title="Show or hide the panel with your notes and the transcription">☰<span class="lbl"> Panel</span></button>
    <button id="leave" title="Leave this lecture">Leave</button>
  </header>
  <main>
    <div id="pageWrap">
      <div id="sheet"><canvas id="ink"></canvas><div id="layer"></div><canvas id="notes"></canvas><div id="pins"></div></div>
      <article id="doc" hidden></article>
    </div>
    <aside id="side">
      <div class="mine">
        <form id="noteForm">
          <input id="noteText" maxlength="1000" autocomplete="off" placeholder="Note to yourself · C: comment · Q: question">
          <button type="submit">Add</button>
        </form>
        <p class="dim small"><b>Double-click the page</b> to write right there. Notes are private; comments and questions go to the lecturer's screen, anonymously.</p>
        <div id="myList"></div>
      </div>
      <div class="side-head"><strong>Transcription</strong> <span class="ai-note">AI transcription: may contain errors</span></div>
      <div id="items"></div>
    </aside>
  </main>
</section>

<!-- double-click on the page: write a note, comment or question right at that spot -->
<form id="placeForm" hidden>
  <textarea id="placeText" maxlength="1000" rows="3" placeholder="Write here…"></textarea>
  <div class="place-act">
    <button type="button" id="placeCancel">Cancel</button>
    <button type="submit" data-kind="note" class="note" title="Stays with you: only you can see it">📝 Note</button>
    <button type="submit" data-kind="comment" class="comment" title="Sent to the lecturer's screen (green circle), anonymously">💬 Comment</button>
    <button type="submit" data-kind="question" class="ask" title="Sent to the lecturer's screen (red circle), anonymously">❓ Question</button>
  </div>
</form>

<p id="boot" class="dim">Loading…</p>
<script type="module" src="viewer.js?v=2026-10-01.1148"></script>
</body>
</html>
